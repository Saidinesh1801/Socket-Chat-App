<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            list-style: none;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .message.own {
            background: #007bff;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .message.other {
            background: #e9ecef;
            color: #333;
        }
        .message-info {
            font-size: 0.8em;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        #form {
            display: flex;
            border-top: 1px solid #ddd;
            background: white;
        }
        #input {
            flex: 1;
            padding: 20px;
            border: none;
            outline: none;
            font-size: 1em;
        }
        #file-input {
            display: none;
        }
        #file-button {
            padding: 20px;
            background: #6c757d;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        #file-button:hover {
            background: #5a6268;
        }
        button {
            padding: 20px 30px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        button:hover {
            background: #218838;
        }
        #room-info {
            background: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            font-size: 0.9em;
            color: #666;
        }
        #typing-indicator {
            padding: 10px 20px;
            font-size: 0.9em;
            color: #666;
            font-style: italic;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">Real-Time Chat App</div>
        <div id="room-info">Room: <span id="current-room"></span> | User: <span id="current-user"></span></div>
        <ul id="messages"></ul>
        <div id="typing-indicator"></div>
        <form id="form">
            <input id="input" autocomplete="off" placeholder="Type a message..." />
            <input type="file" id="file-input" accept="image/*,audio/*,video/*,application/*,text/*" />
            <button type="button" id="file-button">📎</button>
            <button>Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const username = prompt("Enter your name:") || "Anonymous";
        const room = prompt("Enter room name (e.g. Lobby):") || "General";

        document.getElementById('current-user').textContent = username;
        document.getElementById('current-room').textContent = room;

        // Join room immediately
        socket.emit('join room', room);

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const typingIndicator = document.getElementById('typing-indicator');
        const fileInput = document.getElementById('file-input');
        const fileButton = document.getElementById('file-button');

        let typingTimer;
        let selectedFile = null;

        // Listen for history from the database
        socket.on('load messages', (docs) => {
            docs.forEach(msg => {
                displayMessage(msg);
            });
        });

        socket.on('chat message', (msg) => {
            displayMessage(msg);
        });

        socket.on('typing', (data) => {
            console.log('Received typing:', data);
            if (data.user !== username) {
                typingIndicator.textContent = `${data.user} is typing...`;
            }
        });

        socket.on('stop typing', (data) => {
            console.log('Received stop typing:', data);
            if (data.user !== username) {
                typingIndicator.textContent = '';
            }
        });

        input.addEventListener('input', () => {
            console.log('Emitting typing');
            socket.emit('typing', { user: username, room: room });
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                console.log('Emitting stop typing');
                socket.emit('stop typing', { user: username, room: room });
            }, 1000);
        });

        fileButton.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                input.placeholder = `File selected: ${selectedFile.name}`;
            } else {
                input.placeholder = "Type a message...";
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = input.value.trim();
            
            if (!messageText && !selectedFile) return;
            
            let fileData = null;
            if (selectedFile) {
                const formData = new FormData();
                formData.append('file', selectedFile);
                
                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });
                    fileData = await response.json();
                } catch (err) {
                    console.error('Upload failed:', err);
                    return;
                }
            }
            
            socket.emit('chat message', { 
                text: messageText, 
                user: username, 
                room: room,
                file: fileData
            });
            socket.emit('stop typing', { user: username, room: room });
            
            input.value = '';
            input.placeholder = "Type a message...";
            selectedFile = null;
            fileInput.value = '';
        });

        // Helper function to display messages
        function displayMessage(msg) {
            const item = document.createElement('li');
            item.classList.add('message');
            if (msg.user === username) {
                item.classList.add('own');
            } else {
                item.classList.add('other');
            }
            
            let content = `<div class="message-info"><strong>${msg.user}</strong> at ${msg.time}</div>`;
            
            if (msg.text) {
                content += `<div>${msg.text}</div>`;
            }
            
            if (msg.file) {
                if (msg.file.mimetype.startsWith('image/')) {
                    content += `<div><img src="${msg.file.url}" alt="${msg.file.originalname}" style="max-width: 200px; max-height: 200px; border-radius: 8px;"></div>`;
                } else {
                    content += `<div><a href="${msg.file.url}" download="${msg.file.originalname}" style="color: #007bff; text-decoration: none;">📎 ${msg.file.originalname} (${formatFileSize(msg.file.size)})</a></div>`;
                }
            }
            
            item.innerHTML = content;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
