name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/chatApp_test
          JWT_SECRET: test_secret
          EMAIL_USER: test@test.com
          EMAIL_PASS: test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check for syntax errors
        run: |
          node --check server.js
          node --check config/db.js
          node --check middleware/socketAuth.js
          node --check socket/handler.js
          node --check routes/auth.js
          node --check routes/rooms.js
          node --check routes/upload.js
          node --check routes/linkPreview.js
          node --check routes/wallpapers.js
          node --check utils/email.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --omit=dev || true

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t socket-chat-app:${{ github.sha }} .

      - name: Test Docker health
        run: |
          docker run -d --name chat-test \
            -e MONGODB_URI=mongodb://host.docker.internal:27017/chatApp \
            -e JWT_SECRET=test_secret \
            -e EMAIL_USER=test@test.com \
            -e EMAIL_PASS=test \
            -p 3000:3000 \
            socket-chat-app:${{ github.sha }}
          sleep 5
          docker logs chat-test
          docker stop chat-test
          docker rm chat-test
